<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="timeconverter.css">
</head>

<body>
    <div class="container d-flex flex-column justify-content-center">
        <div class="bg-container p-5">
            <h1 class="time-container">Time Converter</h1>
            <h1 class="sub-heading">Enter hours and minutes values to convert into seconds</h1>

            <div class="mt-4">
                <label for="hoursInput" class="label">Hours*</label>
                <br />
                <input id="hoursInput" class="input" />
            </div>

            <div class="mt-4">
                <label for="minutesInput" class='label'>Minutes*</label>
                <br />
                <input id="minutesInput" class="input" />
            </div>
            <button id="convertBtn" class="button mt-4">Convert to Seconds</button>
            <p id="errorMsg" class="errormsgcls mt-3"></p>
            <p id="timeInSeconds"></p>
        </div>
    </div>
    <script src="timeconverter.js"></script>
</body>

</html>
